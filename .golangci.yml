version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - err113
    - mnd
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - grouper
    - importas
    - interfacebloat
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tagalign
    - tagliatelle
    - testableexamples
    # - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint

  settings:
    lll:
      line-length: 80
      tab-width: 4
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    wrapcheck:
      # The transports (REST handlers, MCP tools) hand core service errors
      # to internal/pkg/apierrors unchanged; the core already wrapped them
      # with context, and a second wrap would add nothing a client sees.
      ignore-package-globs:
        - github.com/psyb0t/docker-monero/internal/pkg/core/*
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        # invalid.Newf creates a client-safe validation error; it is the
        # origin of the error, not a passthrough from another package.
        - invalid.Newf(
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        # oapi-codegen's strict server models every response as a sealed
        # interface with one implementation per status code. A handler
        # returning the concrete 200 type could not also return a failure, so
        # the interface return is the generated contract, not a choice.
        - github\.com/psyb0t/docker-monero/internal/pkg/http/api\..*ResponseObject
        # The Prometheus client's constructors return interfaces.
        - github\.com/prometheus/client_golang/prometheus\.(Gauge|Histogram|Counter|Observer)
        # The process seam exists so the supervisor and the wallet pool can
        # be driven by a fake launcher in tests. Returning it is the point.
        - github\.com/psyb0t/docker-monero/internal/pkg/process\.Process
        # testcontainers-go hands back a Container interface.
        - github\.com/testcontainers/testcontainers-go\.Container
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/stretchr/testify/
            - github.com/pkg/errors
            - github.com/spf13/viper
            - github.com/sirupsen/logrus
            - github.com/google/uuid
            - github.com/psyb0t
            - github.com/joho/godotenv
            - github.com/spf13/cobra
            # Integration-test harness under tests/ that builds and runs the app
            # image via testcontainers-go. Test-only; production never imports it.
            - github.com/testcontainers/testcontainers-go
            # Metrics. The Prometheus client is the only instrument library
            # the internal listener exposes.
            - github.com/prometheus/client_golang
            # Protobuf types Registry().Gather() returns, read by the
            # metrics tests to assert on gathered samples.
            - github.com/prometheus/client_model
            # The Model Context Protocol server. There is no psyb0t
            # equivalent; this is the reference Go SDK for the protocol.
            - github.com/modelcontextprotocol/go-sdk
            # The schema inference the MCP SDK uses, imported so tool output
            # schemas describe time.Time as a date-time string.
            - github.com/google/jsonschema-go
            # testcontainers hands its HostConfigModifier the moby
            # HostConfig type. Test infrastructure only.
            - github.com/moby/moby/api/types/container

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - maintidx
          - wrapcheck
          # A test case is data. Spelling its numbers and strings inline is
          # what makes the table readable.
          - mnd
          - goconst
          # Table-driven cases across a suite are meant to look alike.
          - dupl
          # Test errors are one-off fixtures, never matched by a caller.
          - err113
          # Shared testcontainers fixtures built once in TestMain live at
          # package scope.
          - gochecknoglobals
      # Servicepack owns these trees and `make servicepack-update` replaces
      # them, so a finding here cannot be fixed downstream.
      - path: ^internal/app/|^internal/pkg/service-manager/|^pkg/runner/
        linters:
          - goconst
      # monerod and monero-wallet-rpc speak snake_case JSON. These structs
      # exist only to marshal that exact wire contract, and the fake wallet
      # mirrors the same bytes. The camelCase house style applies to the API
      # this project publishes, which is api/api.yml.
      - path: ^internal/pkg/monero/(daemonrpc/daemonrpc|walletrpc/types|walletrpc/walletrpctest/walletrpctest)\.go$
        linters:
          - tagliatelle
      # Test helpers that fake external processes in-memory.
      - path: ^internal/pkg/(monero/walletrpc/walletrpctest|process/processtest)/
        linters:
          - err113
          - mnd
          - noctx

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

# Report every finding. The defaults cap output at 50 per linter and 3 per
# message, which hides the tail of a batch.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
